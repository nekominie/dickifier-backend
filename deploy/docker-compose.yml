services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dickifier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_super_password
    volumes:
      - dickifier_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    secrets:
      - postgres_super_password
      - postgres_migrator_password
      - postgres_app_password
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dickifier"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["migrate"]
    command: ["--migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__PublicOrigin: ${DICKIFIER_PUBLIC_ORIGIN:-https://dickifier.nekomisystems.com}
      Security__KnownProxies__0: 172.28.10.10
    secrets:
      - source: jwt_secret_key
        target: Jwt__SecretKey
      - source: security_fingerprint_key
        target: Security__FingerprintKey
      - source: db_migrator_connection
        target: ConnectionStrings__DefaultConnection
    networks:
      - backend_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__PublicOrigin: ${DICKIFIER_PUBLIC_ORIGIN:-https://dickifier.nekomisystems.com}
      Security__KnownProxies__0: 172.28.10.10
    secrets:
      - source: jwt_secret_key
        target: Jwt__SecretKey
      - source: security_fingerprint_key
        target: Security__FingerprintKey
      - source: db_app_connection
        target: ConnectionStrings__DefaultConnection
    networks:
      - frontend_net
      - backend_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ${NEKOMISYSTEMS_DIR:-../../nekomisystems}
      dockerfile: dickifier/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18095:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      frontend_net:
        ipv4_address: 172.28.10.10
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dickifier_pgdata:

networks:
  frontend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  backend_net:
    internal: true

secrets:
  postgres_super_password:
    file: ./secrets/postgres_super_password.txt
  postgres_migrator_password:
    file: ./secrets/postgres_migrator_password.txt
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt
  db_migrator_connection:
    file: ./secrets/db_migrator_connection.txt
  db_app_connection:
    file: ./secrets/db_app_connection.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  security_fingerprint_key:
    file: ./secrets/security_fingerprint_key.txt
