services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dickifier_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_super_password_only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dickifier_test"]
      interval: 2s
      timeout: 3s
      retries: 15
